<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:240px;height:100%;overflow:hidden;background:{{ c.bg }};border-right:1px solid {{ c.bd }};display:flex;flex-direction:column;font-family:Inter,sans-serif;box-sizing:border-box">
<div style="height:56px;padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid {{ c.line }};flex:none">
<img src="assets/icon-septeo-orange.svg" width="24" height="24" alt="" style="display:block">
<span style="font:700 18px/1 Poppins,sans-serif;color:{{ c.logo }};letter-spacing:-.01em">My Docs</span>
</div>
<sc-if value="{{ legacy }}" hint-placeholder-val="{{ true }}">
<div style="padding:16px 20px 10px;display:flex;flex-direction:column;gap:2px">
<span style="font-size:11px;line-height:14px;color:#6A7896">{{ spaceLabel }}</span>
<span style="font-weight:600;font-size:13px;line-height:18px;color:#303441">Atelier Moreau</span>
</div>
</sc-if>
<sc-if value="{{ v2 }}" hint-placeholder-val="{{ false }}">
<div style="margin:{{ rmar }};padding:10px 12px;border-radius:8px;background:{{ c.roleBg }};display:flex;align-items:center;gap:10px">
<span style="width:32px;height:32px;border-radius:8px;background:{{ c.roleIcBg }};color:{{ c.roleIc }};display:flex;align-items:center;justify-content:center;font-size:18px;flex:none"><i class="{{ roleIcon }}"></i></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-weight:700;font-size:13px;line-height:18px;color:{{ c.roleFg }}">{{ roleLabel }}</span><span style="font-size:12px;line-height:16px;color:{{ c.roleMut }}">Atelier Moreau</span></div>
</div>
</sc-if>
<nav style="display:flex;flex-direction:column;gap:2px;padding:4px 8px 12px;flex:1 1 auto;min-height:0;overflow-y:auto">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
<sc-if value="{{ it.h }}" hint-placeholder-val="{{ false }}"><div style="padding:{{ it.hp }};font-weight:700;font-size:11px;line-height:14px;color:{{ it.hc }}">{{ it.label }}</div></sc-if>
<sc-if value="{{ it.i }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:{{ it.gap }};padding:{{ it.pad }};border-radius:8px;background:{{ it.bg }};color:{{ it.fg }};font-weight:600;font-size:{{ it.fs }};line-height:20px;box-shadow:{{ it.sh }}">
<i class="{{ it.icon }}" style="font-size:20px;color:{{ it.ic }};flex:none"></i>
<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.label }}</span>
<sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="flex:none;font-weight:700;font-size:11px;line-height:14px;padding:1px 7px;border-radius:999px;background:{{ it.bb }};color:{{ it.bf }}">{{ it.badge }}</span></sc-if>
</div>
</sc-if>
</sc-for>
</nav>
<sc-if value="{{ showBox }}" hint-placeholder-val="{{ true }}">
<div style="margin:0 12px 12px;padding:12px;border-radius:8px;background:{{ c.box }};display:flex;gap:10px">
<i class="ri-shield-check-line" style="font-size:18px;color:{{ c.shield }};line-height:20px"></i>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-weight:600;font-size:12px;line-height:16px;color:{{ c.co }}">Dernière connexion</span>
<span style="font-size:12px;line-height:16px;color:{{ c.mut }}">{{ lastLogin }}</span>
</div>
</div>
</sc-if>
<div style="padding:12px 16px;border-top:1px solid {{ c.line }};display:flex;align-items:center;gap:10px">
<span style="width:32px;height:32px;border-radius:50%;background:{{ c.av }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none">{{ u.ini }}</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<span style="font-weight:700;font-size:13px;line-height:16px;color:{{ c.co }}">{{ u.name }}</span>
<span style="font-size:11px;line-height:14px;color:{{ c.mut }}">{{ u.sub }}</span>
</div>
<i class="ri-logout-box-r-line" style="font-size:18px;color:{{ c.out }}"></i>
</div>
</div>
</x-dc>

</body>
</html>
